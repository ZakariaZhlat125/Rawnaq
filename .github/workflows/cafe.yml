name: Cafe

on:
  pull_request:
    paths: ['apps/cafe/**', '.github/workflows/cafe.yml']
  push:
    branches: [main]
    paths: ['apps/cafe/**', '.github/workflows/cafe.yml']

concurrency:
  group: cafe-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/cafe

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cafe/package-lock.json

      - run: npm ci

      # TODO: remove continue-on-error once the 5 existing lint errors are fixed
      # (browser globals missing in eslint.config.js, empty block in storage.ts).
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - run: npm test

      - name: Build (includes type-check)
        run: npm run build
