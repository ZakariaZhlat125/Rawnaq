name: Deploy script

on:
  pull_request:
    paths: ['deploy/**', '.github/workflows/deploy-script.yml']
  push:
    branches: [main]
    paths: ['deploy/**', '.github/workflows/deploy-script.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning deploy/remote.sh deploy/tests/remote.test.sh
      - name: Simulated deploys, failures and rollbacks
        run: bash deploy/tests/remote.test.sh
