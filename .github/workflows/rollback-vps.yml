name: Rollback VPS

# Manual: Actions > Rollback VPS > Run workflow. Switches the app on the Hostinger
# VPS back to the release before the current one and deletes the abandoned release.
# Database migrations are not reverted (restore backend/shared/backups/db-<id>.sql.gz
# if needed). Reads only the VPS_* settings, see deploy-vps.yml.
on:
  workflow_dispatch:
    inputs:
      app:
        type: choice
        options: [backend, web]
        required: true

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  rollback:
    name: ${{ inputs.app }} on vps
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
      PHP_BIN: ${{ vars.VPS_PHP_BIN || 'php' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ssh-setup
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          host: ${{ vars.VPS_SSH_HOST }}
          port: ${{ vars.VPS_SSH_PORT || '22' }}
          user: ${{ vars.VPS_SSH_USER }}

      - name: Roll back
        env:
          APP: ${{ inputs.app }}
        run: ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' PHP_BIN='$PHP_BIN' bash '$DEPLOY_PATH/.deploy/remote.sh' rollback '$APP'"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Rollback: ${{ inputs.app }} on vps"
            echo '```'
            ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' bash '$DEPLOY_PATH/.deploy/remote.sh' status" 2>&1 || echo "(status unavailable)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
