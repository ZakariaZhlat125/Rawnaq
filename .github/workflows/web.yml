name: Web

on:
  pull_request:
    paths: ['apps/web/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/web.yml']

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://127.0.0.1:8000/api' }}

      # Browser tests (*.browser.test.cjs) need Playwright and a running site, so only
      # the unit tests run here.
      # TODO: remove continue-on-error once booking-products, booking-receipt,
      # customer-notifications and payment-policy tests are updated.
      - name: Unit tests
        continue-on-error: true
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.*js' ! -name '*.browser.*' | sort)
          node --test "${files[@]}"
