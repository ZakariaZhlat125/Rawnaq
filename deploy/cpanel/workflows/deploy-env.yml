name: Deploy environment

# Deploys to one GitHub Environment (staging or production). Called by deploy.yml.
# Per-environment variables and secrets are listed in docs/deploy.md.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      backend:
        type: boolean
        default: false
      web:
        type: boolean
        default: false
      backup-db:
        type: boolean
        default: false
      skip-health-check:
        type: boolean
        default: false

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.WEB_URL }}
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          NEED_BACKEND: ${{ inputs.backend }}
          NEED_WEB: ${{ inputs.web }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          required=(DEPLOY_PATH)
          [[ "$NEED_BACKEND" == true ]] && required+=(API_URL)
          [[ "$NEED_WEB" == true ]] && required+=(WEB_URL VITE_API_BASE_URL)
          missing=()
          for name in "${required[@]}"; do [[ -n "${!name}" ]] || missing+=("$name"); done
          if (( ${#missing[@]} )); then
            echo "::error::Missing variables in the '${{ inputs.environment }}' environment: ${missing[*]} (see docs/deploy.md)"
            exit 1
          fi

      - name: Release id
        id: release
        run: echo "id=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Build in the deploy job so the package can be sent straight to the
      # server without consuming GitHub Actions artifact storage.
      - uses: shivammathur/setup-php@v2
        if: inputs.backend
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, exif, bcmath
          coverage: none

      - name: Cache Composer packages
        if: inputs.backend
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      # Scripts (package:discover) run on the server, where .env and storage exist.
      - name: Build backend
        if: inputs.backend
        working-directory: backend
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader --no-scripts

      - name: Package backend
        if: inputs.backend
        working-directory: backend
        run: >
          tar -czf ../backend.tar.gz
          --exclude=./tests --exclude=./node_modules --exclude='./Modules/*/node_modules'
          --exclude=./storage --exclude=./.env --exclude='./bootstrap/cache/*.php'
          --exclude=./.phpunit.result.cache --exclude=./cachePath .

      - uses: ./.github/actions/ssh-setup
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          host: ${{ vars.SSH_HOST }}
          port: ${{ vars.SSH_PORT || '22' }}
          user: ${{ vars.SSH_USER }}

      - name: Upload deploy script
        run: |
          ssh deploy "mkdir -p '$DEPLOY_PATH/.deploy'"
          rsync -az deploy/remote.sh "deploy:$DEPLOY_PATH/.deploy/remote.sh"
          ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' bash '$DEPLOY_PATH/.deploy/remote.sh' init"

      # ---------------- backend ----------------
      - name: Upload backend
        if: inputs.backend
        run: |
          mkdir build
          tar -xzf backend.tar.gz -C build
          rsync -az --delete build/ "deploy:$DEPLOY_PATH/backend/upload/"

      - name: Activate backend release (migrate + switch)
        if: inputs.backend
        env:
          RELEASE: ${{ steps.release.outputs.id }}
          BACKUP_FLAG: ${{ inputs.backup-db && '--backup-db' || '' }}
        run: ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' PHP_BIN='$PHP_BIN' bash '$DEPLOY_PATH/.deploy/remote.sh' backend '$RELEASE' $BACKUP_FLAG"

      - name: Backend health check
        if: inputs.backend && !inputs.skip-health-check
        env:
          RELEASE: ${{ steps.release.outputs.id }}
        run: |
          for attempt in $(seq 1 10); do
            body="$(curl -fsS --max-time 10 "$API_URL/api/health" || true)"
            if [[ "$(jq -r '.release // empty' <<< "$body" 2>/dev/null)" == "$RELEASE" ]]; then
              echo "healthy: $body"
              exit 0
            fi
            echo "attempt $attempt: ${body:-no response}"
            sleep 6
          done
          echo "::error::$API_URL/api/health did not report release $RELEASE; rolling back the backend"
          ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' PHP_BIN='$PHP_BIN' bash '$DEPLOY_PATH/.deploy/remote.sh' rollback backend"
          exit 1

      # ---------------- web ----------------
      - uses: actions/setup-node@v4
        if: inputs.web
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The API address is baked into the bundle, so web is built per environment.
      - name: Build web
        if: inputs.web
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /
          RELEASE: ${{ steps.release.outputs.id }}
        run: |
          npm ci
          npm run build
          echo "$RELEASE" > dist/release.txt

      - name: Upload and activate web release
        if: inputs.web
        env:
          RELEASE: ${{ steps.release.outputs.id }}
        run: |
          rsync -az --delete apps/web/dist/ "deploy:$DEPLOY_PATH/web/upload/"
          ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' bash '$DEPLOY_PATH/.deploy/remote.sh' web '$RELEASE'"

      - name: Web health check
        if: inputs.web && !inputs.skip-health-check
        env:
          RELEASE: ${{ steps.release.outputs.id }}
        run: |
          for attempt in $(seq 1 10); do
            served="$(curl -fsS --max-time 10 "$WEB_URL/release.txt?t=$(date +%s)" || true)"
            if [[ "$served" == "$RELEASE" ]] && curl -fsS --max-time 10 -o /dev/null "$WEB_URL/"; then
              echo "web serves $RELEASE"
              exit 0
            fi
            echo "attempt $attempt: ${served:-no response}"
            sleep 6
          done
          echo "::error::$WEB_URL is not serving release $RELEASE; rolling back web"
          ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' bash '$DEPLOY_PATH/.deploy/remote.sh' rollback web"
          exit 1

      - name: Summary
        if: always() && steps.release.outputs.id != ''
        run: |
          {
            echo "### ${{ inputs.environment }}: release \`${{ steps.release.outputs.id }}\`"
            echo '```'
            ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' bash '$DEPLOY_PATH/.deploy/remote.sh' status" 2>&1 || echo "(status unavailable)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
