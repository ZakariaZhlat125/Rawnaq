name: Deploy

# Manual deploy to production: Actions > Deploy > Run workflow.
# Settings come from repository variables/secrets (docs/deploy.md).
#
# To deploy automatically on every merge to main later, add under `on:`
#   push:
#     branches: [main]
# To add a staging environment later, see docs/deploy.md ("staging").
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Deploy the backend (Laravel)
        type: boolean
        default: true
      web:
        description: Deploy the customer website
        type: boolean
        default: true
      skip-health-check:
        description: First deploy only, before the domains point to ~/sami/production
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a deploy halfway

jobs:
  production:
    if: inputs.backend || inputs.web
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      backend: ${{ inputs.backend }}
      web: ${{ inputs.web }}
      backup-db: true
      skip-health-check: ${{ inputs.skip-health-check }}
    secrets: inherit
