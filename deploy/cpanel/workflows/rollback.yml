name: Rollback

# Manual: Actions > Rollback > Run workflow. Switches the app back to the release
# before the current one and deletes the abandoned release. Database migrations
# are not reverted (restore backend/shared/backups/db-<id>.sql.gz if needed).
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      app:
        type: choice
        options: [backend, web]
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: ${{ inputs.app }} on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ssh-setup
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          host: ${{ vars.SSH_HOST }}
          port: ${{ vars.SSH_PORT || '22' }}
          user: ${{ vars.SSH_USER }}

      - name: Roll back
        env:
          APP: ${{ inputs.app }}
        run: ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' PHP_BIN='$PHP_BIN' bash '$DEPLOY_PATH/.deploy/remote.sh' rollback '$APP'"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Rollback: ${{ inputs.app }} on ${{ inputs.environment }}"
            echo '```'
            ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' bash '$DEPLOY_PATH/.deploy/remote.sh' status" 2>&1 || echo "(status unavailable)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
